plugins {
    id 'java'
    id 'maven-publish'
}

description = 'Catalog of the SCOTT database for DuckDB: db.json, model.json and measures.json, the measures of the Apache Ossie scott_model.'

dependencies {
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.jackson.databind
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'koryki-scott-catalog'
            pom {
                name = 'koryki-scott-catalog'
            }
        }
    }
}
